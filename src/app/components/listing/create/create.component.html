<div class="create-listing-container">
    <h2>Create New Post</h2>
    
    <form [formGroup]="listingForm" (ngSubmit)="onSubmit()" class="listing-form">
        <div class="form-section">
            <div class="form-group">
              <label>Upload Photos</label>
              <input 
                type="file" 
                (change)="onFileSelected($event)" 
                multiple 
                accept="image/*"
                class="form-control" style="width: 95%;"
              >
            </div>
      
            <div class="image-previews" *ngIf="previewUrls.length > 0">
              <div *ngFor="let url of previewUrls; let i = index" class="image-preview">
                <img [src]="url" alt="Preview">
                <button 
                  type="button" 
                  (click)="removeImage(i)" 
                  class="remove-image-btn"
                >
                  
                </button>
              </div>
            </div>
          </div>
      <!-- Property Type and Name -->
      <div class="form-section">
        <div class="form-group">
          <label for="propertyType">Choose your Apartment/Building</label>
          <select id="propertyType" formControlName="propertyType" class="form-control">
            <option *ngFor="let type of propertyTypes" [value]="type">{{ type }}</option>
          </select>
        </div>
        
        <div class="form-group">
          <label for="propertyName">Enter the name</label>
          <input 
            type="text" 
            id="propertyName" 
            formControlName="propertyName" 
            placeholder="Enter property name"
            class="form-control" style="width: 95%;"
          >
        </div>
      </div>
  
      <!-- Shared Property -->
      <div class="form-section">
        <div class="form-group">
          <label>Is this a shared property?</label>
          <div class="radio-group">
            <label>
              <input type="radio" formControlName="isShared" value="Yes"> Yes
            </label>
            <label>
              <input type="radio" formControlName="isShared" value="No"> No
            </label>
          </div>
        </div>
      </div>
  
      <!-- Property Location -->
      <div class="form-section">
        <div class="form-group">
          <label for="address">Property Location</label>
          <input 
            type="text" 
            id="address" 
            formControlName="address" 
            placeholder="Enter street address"
            class="form-control" style="width: 95%;"
          >
        </div>
      </div>
  
      <!-- Property Details -->
      <div class="form-section">
        <div class="form-group">
          <label for="squareFeet">Square Feet</label>
          <input 
            type="number" 
            id="squareFeet" 
            formControlName="squareFeet" 
            placeholder="Enter area in square feet"
            class="form-control"
            min="1" style="width: 95%;"
          >
        </div>
        
        <div class="form-group">
          <label>Stay / Lease type</label>
          <div class="radio-group">
            <label>
              <input type="radio" formControlName="leaseType" value="Long term"> Long term (6+ months)
            </label>
            <label>
              <input type="radio" formControlName="leaseType" value="Short term"> Short term
            </label>
            <label>
              <input type="radio" formControlName="leaseType" value="Both"> Both
            </label>
          </div>
        </div>
      </div>
  
      <!-- Expected Rent -->
      <div class="form-section">
        <div class="form-group">
          <label for="price">Expected Rent</label>
          <input 
            type="number" 
            id="price" 
            formControlName="price" 
            placeholder="Enter expected rent"
            class="form-control"
            min="1" style="width: 95%;"
          >
        </div>
        
        <div class="form-group">
          <label>
            <input type="checkbox" formControlName="isPriceNegotiable"> Negotiable
          </label>
        </div>
        
        <div class="form-group">
          <label>Price Mode</label>
          <div class="radio-group">
            <label>
              <input type="radio" formControlName="priceMode" value="Per Month"> Per Month
            </label>
            <label>
              <input type="radio" formControlName="priceMode" value="Utilities included in rent"> Utilities included in rent
            </label>
          </div>
        </div>
      </div>
  
      <!-- Furnished Status -->
      <div class="form-section">
        <div class="form-group">
          <label>Is the room/apartment furnished?</label>
          <div class="radio-group">
            <label>
              <input type="radio" formControlName="isFurnished" value="Yes"> Yes
            </label>
            <label>
              <input type="radio" formControlName="isFurnished" value="No"> No
            </label>
          </div>
        </div>
      </div>
  
      <!-- Amenities -->
      <div class="form-section">
        <div class="form-group">
          <label>Amenities included</label>
          <div class="amenities-grid">
            <div *ngFor="let amenity of amenitiesList; let i = index" class="amenity-item">
              <label>
                <input type="checkbox" [formControl]="amenitiesFormArray.controls[i]"> {{ amenity }}
              </label>
            </div>
          </div>
        </div>
      </div>
  
      <!-- Description -->
      <div class="form-section">
        <div class="form-group">
          <label for="title">Title</label>
          <input 
            type="text" 
            id="title" 
            formControlName="title" 
            placeholder="Enter your AD title"
            class="form-control" style="width: 95%;"
          >
        </div>
        
        <div class="form-group">
          <label for="description">Description</label>
          <textarea 
            id="description" 
            formControlName="description" 
            placeholder="Enter a detailed description within 1400 characters"
            class="form-control"
            rows="5" style="width: 95%;"
          ></textarea>
          <div class="char-count">
            {{ listingForm.get('description')?.value?.length || 0 }}/1400
          </div>
        </div>
      </div>
  
      <div class="form-actions">
        <button type="button" class="btn btn-secondary" routerLink="/listings" style="background-color: rgb(243, 90, 90);color: white;">Cancel</button>
        <button type="submit" class="btn btn-primary" [disabled]="listingForm.invalid" style="background-color: rgb(88, 88, 243);">Post</button>
      </div>
    </form>
  </div>
